<div x-data @htmx:before-request.document="$root.remove()" class="toast align-items-center text-bg-danger border-0 show"
    role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex align-items-center">
        <svg class="mx-2" width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <circle cx="12" cy="17" r="1" fill="#a80000"></circle> <path d="M12 10L12 14" stroke="#a80000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M3.44722 18.1056L10.2111 4.57771C10.9482 3.10361 13.0518 3.10362 13.7889 4.57771L20.5528 18.1056C21.2177 19.4354 20.2507 21 18.7639 21H5.23607C3.7493 21 2.78231 19.4354 3.44722 18.1056Z" stroke="#a80000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
        <div class="toast-body text-center flex-grow-1">
            {{error}}
        </div>

            aria-label="Close"></button>
    </div>
</div>
