<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline;
        }

        .htmx-request.htmx-indicator {
            display: inline;
        }

        .loader {
            width: 48px;
            height: 48px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            animation: roll 1s ease-in-out infinite alternate;
        }

        .loader:after {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 5px solid;
            border-color: #400af4 transparent;
        }

        @keyframes roll {
            0% {
                transform: translateX(-150%) rotate(0deg);
            }

            100% {
                transform: translateX(150%) rotate(360deg);
            }
        }
    </style>
</head>

<body class="d-flex flex-column" style="height: 100vh;" hx-indicator="#indicator" hx-push-url="true">

    <!-- Cabeçalho NAV -->
    <header class="mb-3 shadow-sm px-5 bg-body-tertiary">
        {% include 'components/_navbar.html' %}
    </header>

    <!-- Conteúdo principal -->
    <main id="main-content" class="flex-grow-1 container d-flex flex-column justify-content-center">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="container-fluid d-flex flex-column justify-content-center py-2">
        <span class="text-center fs-5 fw-light text-primary">Meu Site {{ get_current_year() }}</span>
        <p class="fs-7 text-center fw-lighter">Todos os direitos reservados.</p>
    </footer>

    <!-- Spinner loader -->
    <div id="indicator" class="htmx-indicator position-fixed bg-primary"
        style="height: 100vh;width: 100%;z-index: 99999999;opacity: 0.2;">
        <div class="container-fluid h-100 d-flex justify-content-center align-items-center">
            <span class="loader"></span>
        </div>
    </div>

    <!-- Notificações -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" id="error-banner"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</body>

</html>
